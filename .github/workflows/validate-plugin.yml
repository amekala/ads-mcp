name: Validate Plugin

# Marketplace packaging gates:
#  1. Claude manifest + marketplace validation
#  2. Cursor manifest validation against Cursor's current public schema
#  3. Frontmatter YAML parsing across all .md files — the check whose failure
#     silently froze our community-marketplace SHA pin for three months
#     (anthropics/claude-plugins-community#964)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Plain (non-strict) validate: --strict turns the *absence* of a version
      # field into an error, but we deliberately omit version so updates
      # version-resolve by commit SHA (docs/plugin-update-playbook.md §2).
      - name: Validate plugin manifest
        run: claude plugin validate .

      # plugins/claude is the standalone package mirrored to Adspirer/adspirer-claude-plugin.
      - name: Validate the Claude plugin package
        run: claude plugin validate plugins/claude

      - name: Validate Cursor plugin manifest against the current schema
        run: |
          curl -fsSLo /tmp/cursor-plugin.schema.json \
            https://raw.githubusercontent.com/cursor/plugins/main/schemas/plugin.schema.json
          npx --yes --package ajv-cli@5 --package ajv-formats@3 ajv validate --spec=draft7 \
            -s /tmp/cursor-plugin.schema.json \
            -d plugins/cursor/adspirer/.cursor-plugin/plugin.json \
            -c ajv-formats

      # Guard the SHA-versioning decision: a "version" field in plugin.json or
      # a marketplace entry silently pins users until it is manually bumped.
      # It has been accidentally re-added once already (76b05ab).
      - name: Enforce SHA-based versioning (no version field)
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   plugins/grok/.grok-plugin/plugin.json; do
            if ! jq -e '[.. | objects | select(has("version"))] | length == 0' "$f" >/dev/null; then
              echo "::error file=$f::contains a \"version\" field — we version by commit SHA; see docs/plugin-update-playbook.md §2"
              exit 1
            fi
          done

      - name: Validate YAML frontmatter in all .md files
        run: |
          npm install --no-save js-yaml
          node scripts/validate-frontmatter.mjs

      # plugins/hermes is mirrored to Adspirer/adspirer-hermes-plugin, which the Hermes catalog
      # pins by sha. This is the catalog's own admission command, at the same pinned Hermes
      # commit the mirror's CI uses, so a package Hermes would reject fails here first.
      - name: Check out the Hermes validator
        uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          ref: 8a92051f20e6b371c4ff1a46a5bcec7138cc4e8c
          path: .hermes-agent

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate the Hermes plugin package
        run: |
          pip install -e .hermes-agent
          hermes plugins validate plugins/hermes
